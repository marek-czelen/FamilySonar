[versions]
agp = "8.13.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
navigationFragment = "2.7.7"
navigationUi = "2.7.7"
library = "1.3.0"
playServicesLocation = "15.0.1"
swipeRevealLayout = "1.4.1"
swipereveallayoutVersion = "1.5.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigationUi" }
library = { group = "com.baoyz.swipemenulistview", name = "library", version.ref = "library" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
swipe-reveal-layout = { module = "com.chauthai.swipereveallayout:swipe-reveal-layout", version.ref = "swipeRevealLayout" }
swipereveallayout = { module = "com.github.Android-library-copy-dependencies:SwipeRevealLayout", version.ref = "swipereveallayoutVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

